<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividades del DOM</title>
  <link rel="stylesheet" href="estiloseje.css">
  <script src="jseje.js" defer></script>
</head>
<body>
  <h2>1. Modificar texto</h2>
  <p id="mensaje"></p>
  <p id="ejemploHTML"></p>

  <h2>2. Mostrar u ocultar imagen</h2>
  <button id="alternar">Mostrar / Ocultar</button>
  <img id="imagen" src="imagenes/imagen1.jpg" alt="Imagen del ejercicio">

  <h2>3. Lista de compras</h2>
  <input id="producto" placeholder="Escribe un producto">
  <button id="agregar">Agregar</button>
  <ul id="lista"></ul>

  <h2>4. Galería de imágenes</h2>
  <img id="principal" src="imagenes/imagen1.jpg" alt="Primera foto">

  <div id="galeria">
    <img src="imagenes/imagen1.jpg" alt="Primera foto">
    <img src="imagenes/imagen2.jpg" alt="Segunda foto">
  </div>

  <h2>5. Validar contraseña</h2>
  <input id="clave" type="password" placeholder="Contraseña">
  <p id="error" aria-live="polite"></p>
</body>
</html>
